name: Monthly parcel ingest

# Runs after you implement county loaders in scripts/ingest/run-ingest.ts
# and add secrets: DATABASE_URL

on:
  schedule:
    - cron: "0 12 1 * *" # 1st of each month ~12:00 UTC
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Seed markets (idempotent)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/seed-demo.ts
      - name: Ingest county parcels
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/ingest/run-ingest.ts --market all
